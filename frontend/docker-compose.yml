# ==============================
# 開発環境用 Docker Compose
# ==============================
# Next.js フロントエンドのみを起動
# Supabase は別途 `supabase start` で起動してください

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      # ホットリロード対応: ホストのファイルをコンテナにマウント
      - .:/app
      # node_modules は別ボリューム（ホストと干渉しないように）
      - /app/node_modules
      # .next ビルドキャッシュも別ボリューム
      - /app/.next
    environment:
      # 環境変数（必要に応じて追加）
      - NODE_ENV=development
      # Supabase ローカル接続先（supabase start 実行時）
      - NEXT_PUBLIC_SUPABASE_URL=http://localhost:54321
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0
    # ホットリロードのためにファイル監視
    stdin_open: true
    tty: true
